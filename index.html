<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="header">
        Library
        <button command="show-modal" commandfor="add-book-dialog">Add a new book</button>
    </div>
    <div class = "grid">

    </div>
    <dialog id="add-book-dialog">
        <div id = "form">
            <label for="name">Name:</label>
            <input type="text" id = "name">
            <label for="author">Author:</label>
            <input type="text" id = "author">
            <label for="description">Description:</label>
            <input type="text" id = "description">
            <label for="pages">Pages:</label>
            <input type="text" id = "pages">            
        </div>
        <button id="add-button" commandfor="add-book-dialog" command="close">Add</button>
        <button commandfor="add-book-dialog" command="close">Cancel</button>
    </dialog>
</body>
<script src="script.js"></script>
</html>
